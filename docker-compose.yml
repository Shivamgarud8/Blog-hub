services:
  postgres:
    image: postgres:18-alpine
    container_name: blog-gen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blog_gen}
      POSTGRES_USER: ${POSTGRES_USER:-blog_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to localhost for security; never expose raw database to public internet
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blog_user} -d ${POSTGRES_DB:-blog_gen}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blog_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog-gen-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blog_gen}
      POSTGRES_USER: ${POSTGRES_USER:-blog_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-blog_user}:${POSTGRES_PASSWORD:-change_this_password}@postgres:5432/${POSTGRES_DB:-blog_gen}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_secret_super_secure_key_12345}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_API_BASE_URL: ${IMAGE_API_BASE_URL:-https://api.openai.com/v1}
      IMAGE_MODEL: ${IMAGE_MODEL:-dall-e-3}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - blog_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-gen-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - blog_net

volumes:
  postgres_data:
    name: blog_gen_postgres_data
    driver: local
  backend_uploads:
    name: blog_gen_backend_uploads
    driver: local

networks:
  blog_net:
    name: blog_gen_network
    driver: bridge
